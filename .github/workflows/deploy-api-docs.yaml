name: Deploy API Documentation

on:
  push:
    branches:
      - main
    paths:
      - 'openapi/**'
      # složka openapi v rootu
      # == pipeline se spustí pokud nastane změna ve složce 'openapi' v branchi main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.2
        # použité verze je třeba občas zaktualizovat 

      - name: Setup Node.js
        uses: actions/setup-node@v6.4.0
         # použité verze je třeba občas zaktualizovat 
        with:
          node-version: '24'
          # verze nodeJS - GitHub vyžaduje použití min. verze

      - name: Install Redocly CLI
        run: npm install -g @redocly/cli

      - name: Build HTML documentation
        run: redocly build-docs openapi/*.yaml -o index.html
        # HTMN soubor se vygeneruje ze souboru .yaml ve složce 'openapi'

      - name: Initialize or configure GitHub Pages
        # Nastaví zdroj nasazení GitHub Pages na GitHub Actions (build_type: workflow)
        # Pokud Pages ještě neexistují, vytvoří je (POST); pokud existují, aktualizuje zdroj (PUT)
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${{ github.repository }}/pages)

          if [ "$STATUS" = "404" ]; then
            echo "GitHub Pages neexistují – inicializuji..."
            curl -s -X POST \
              -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              https://api.github.com/repos/${{ github.repository }}/pages \
              -d '{"build_type":"workflow"}'
          else
            echo "GitHub Pages existují – nastavuji zdroj na GitHub Actions..."
            curl -s -X PUT \
              -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              https://api.github.com/repos/${{ github.repository }}/pages \
              -d '{"build_type":"workflow"}'
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
                 # použité verze je třeba občas zaktualizovat 
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
                 # použité verze je třeba občas zaktualizovat 
